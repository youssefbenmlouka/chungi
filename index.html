<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chungi.io - Play Chungi Online</title>
<meta name="description" content="Play Chungi online: a race game for two players on a 4 by 8 board. Play a friend, play the computer, or find an opponent.">
<meta name="theme-color" content="#2e2c29">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2045%2045%22%3E%3Crect%20width%3D%2245%22%20height%3D%2245%22%20rx%3D%228%22%20fill%3D%22%2374965a%22%2F%3E%3Cpath%20fill%3D%22%23f4c530%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.7%22%20d%3D%22M10.5%2041%20H34.5%20V37%20H31.5%20L30.5%2028%20H14.5%20L13.5%2037%20H10.5%20Z%22%2F%3E%3Cpath%20fill%3D%22%23f4c530%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.7%22%20d%3D%22M12%2028%20V20.5%20H16.4%20V23.5%20H20.3%20V20.5%20H24.7%20V23.5%20H28.6%20V20.5%20H33%20V28%20Z%22%2F%3E%3Cpath%20fill%3D%22%23161413%22%20d%3D%22M22.5%202%20L29.5%2018.2%20C26%2020%2019%2020%2015.5%2018.2%20Z%22%2F%3E%3Cellipse%20fill%3D%22%23161413%22%20cx%3D%2222.5%22%20cy%3D%2218.6%22%20rx%3D%2212.5%22%20ry%3D%223.1%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#2e2c29; --side:#232220; --panel:#252422; --panel2:#1d1c1a; --fg:#f3f2ee; --muted:#a9a59e; --line:#3d3b37;
  --sq1:#ebecd3; --sq2:#74965a; --hl:rgba(246,233,82,.62);
  --go:#82b34e; --go-edge:#56803a; --gold:#f2c14e; --mag:#f4c530; --bar:rgba(138,92,245,.36); --danger:#c94f43;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:flex;min-height:100%}
.sidebar{flex:0 0 150px;background:var(--side);display:flex;flex-direction:column;padding:14px 0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 14px 14px;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;cursor:pointer;background:none;border:0;text-align:left}
.brand i{position:relative;width:34px;height:34px;display:block;flex:none}
.brand small{color:var(--go);font-weight:800}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 16px;font-weight:700;font-size:1rem;cursor:pointer;text-align:left;color:#dedbd4}
.nav button:hover,.nav button.on{background:#1a1917;color:#fff}
.nav svg{width:22px;height:22px;flex:none}
.me{margin-top:auto;padding:12px 14px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.me input{width:100%;background:#3a3835;border:1px solid var(--line);border-radius:5px;color:var(--fg);padding:6px 8px;font:inherit}
main{flex:1;min-width:0;padding:22px 20px 40px;display:flex;justify-content:center}
.stage{display:flex;gap:26px;align-items:flex-start;justify-content:center;width:100%;max-width:900px}
.boardcol{flex:0 0 auto;width:min(21rem,calc((100vh - 150px)/2));min-width:13.5rem;display:flex;flex-direction:column;gap:8px;position:relative}
.sidecol{flex:1 1 20rem;max-width:27rem;min-width:0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:9px;min-height:42px}
.bar .av{position:relative;width:40px;height:40px;border-radius:4px;background:#565350;flex:none}
.bar .av.b{background:#8d8a85}
.bar .nm{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.bar .nm b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm small{color:var(--muted);font-size:.76rem}
.clk{font-family:var(--mono);font-size:1.15rem;font-weight:700;padding:6px 12px;border-radius:5px;background:#3a3835;color:#8e8a84;min-width:5.2rem;text-align:right}
.clk.on{background:#f3f2ee;color:#262522}
.clk.low.on{background:var(--danger);color:#fff}
.clk.txt{font-size:.78rem;font-family:var(--font);min-width:0}
.board{display:grid;grid-template-columns:repeat(4,1fr);border-radius:4px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;margin:0;background:var(--sq1);cursor:default;display:block;color:var(--sq2);font:inherit}
.cell.alt{background:var(--sq2);color:var(--sq1)}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;z-index:3}
.cell .co{position:absolute;font-size:.68rem;font-weight:700;line-height:1;z-index:1;pointer-events:none}
.cell .co.rk{top:3px;left:4px}
.cell .co.fl{bottom:3px;right:4px}
.cell.last,.cell.sel{box-shadow:inset 0 0 0 99px var(--hl)}
.cell.barrier::before{content:"";position:absolute;inset:0;background:var(--bar)}
.cell.t,.cell.own{cursor:pointer}
.cell .dot{position:absolute;inset:34%;border-radius:50%;background:rgba(0,0,0,.28);z-index:2}
.cell .dot.bounce{background:transparent;border:5px solid rgba(0,0,0,.45);inset:22%}
.cell .dot.kick{border-radius:3px;transform:rotate(45deg);background:rgba(0,0,0,.42)}
.cell .dot.place{inset:28%;background:rgba(244,197,48,.75);border:2px solid #111}
.cell .trail{position:absolute;inset:42%;border-radius:50%;background:#111;opacity:.6}
.pc{position:absolute;inset:3%;z-index:1;display:block;pointer-events:none}
.pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.pc .body{stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.pc.w .body{fill:#f9f9f7;stroke:#34322f}
.pc.b .body{fill:#4a4845;stroke:#131211}
.pc.w .eye{fill:#34322f}
.pc.b .eye{fill:#ecebe6}
.pc .dir{fill:var(--gold);stroke:#34322f;stroke-width:1;stroke-linejoin:round}
.pc .ring{fill:rgba(242,193,78,.25);stroke:var(--gold);stroke-width:2.2;stroke-dasharray:4 3}
.pc .my{fill:var(--mag);stroke:#111;stroke-width:1.7;stroke-linejoin:round}
.pc .mk{fill:#161413;stroke:#111;stroke-width:1.7;stroke-linejoin:round}
.pc.ghost{opacity:.45}
.card{background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:1.35rem;font-weight:800;text-align:center}
.card h3{margin:0;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{font-weight:800;font-size:1.25rem;line-height:1.2;margin:0}
.hint{color:var(--muted);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.b{font-weight:800;border-radius:9px;border:0;border-bottom:4px solid var(--go-edge);background:var(--go);color:#fff;padding:11px 18px;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.25);font-size:1rem}
button.b:hover{filter:brightness(1.08)}
button.b.big{font-size:1.25rem;padding:15px 18px;width:100%}
button.b.ghost{background:#3f3d39;border-bottom-color:#2d2b28;font-weight:700;text-shadow:none}
button.b.gold{background:var(--mag);border-bottom-color:#b8901a;color:#1c1a17;text-shadow:none}
button.b.danger{background:#4a3a38;border-bottom-color:#352927;font-weight:700;text-shadow:none}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.b:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt{display:flex;align-items:center;gap:14px;background:#33312e;border:0;border-bottom:4px solid #262421;border-radius:9px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.opt:hover{background:#3b3936}
.opt svg{width:38px;height:38px;flex:none}
.opt b{display:block;font-size:1.08rem}
.opt small{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#3a3835;border:2px solid transparent;border-radius:7px;padding:9px 0;font-weight:800;cursor:pointer;flex:1 1 4.2rem;text-align:center;font-family:var(--mono)}
.chip.on{border-color:var(--go);background:#2f3a26}
.chip.txt{font-family:var(--font)}
.field{display:flex;gap:8px;align-items:center}
.field input{flex:1;min-width:0;background:#1b1a18;border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:10px;font:inherit}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-weight:700;align-self:flex-start}
.back:hover{color:#fff}
.moves{margin:0 -16px -16px;padding:0;list-style:none;font-size:.86rem;color:#cfccc5;max-height:15rem;overflow:auto;border-radius:0 0 8px 8px;counter-reset:m}
.moves li{padding:5px 16px 5px 46px;position:relative;counter-increment:m}
.moves li::before{content:counter(m) ".";position:absolute;left:16px;color:var(--muted);font-family:var(--mono);font-size:.78rem;top:7px}
.moves li:nth-child(odd){background:var(--panel2)}
.moves li:last-child{color:#fff;font-weight:700}
.over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,17rem);background:var(--panel);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:5;overflow:hidden;text-align:center}
.over .top{background:#3a3835;padding:16px 12px}
.over .top.win{background:var(--go)}
.over .top b{display:block;font-size:1.4rem;font-weight:800}
.over .top span{font-size:.88rem;opacity:.9}
.over .bd{padding:14px;display:flex;flex-direction:column;gap:8px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #4a4744;border-top-color:var(--go);margin:6px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.learn{max-width:46rem;width:100%;display:flex;flex-direction:column;gap:14px}
.learn h1{margin:0;font-size:1.9rem;font-weight:800}
.learn .card{gap:8px}
.learn .card h2{text-align:left;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.learn .card h2 i{position:relative;width:34px;height:34px;display:block;flex:none;background:var(--sq2);border-radius:4px}
.learn ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px;color:#d9d6cf}
.learn p{margin:0;color:#d9d6cf}
.note{color:var(--gold);margin:0;font-size:.9rem}
.flag{display:inline-block;margin-left:6px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.35);font-size:.7rem;color:var(--muted)}
.lrow{display:inline-flex;align-items:center}
.lrow .av{position:relative;width:26px;height:26px;border-radius:4px;flex:none;margin-right:8px;display:inline-block}
.lrow .flag{margin-left:6px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pk{position:relative;width:46px;height:46px;border-radius:6px;border:3px solid transparent;cursor:pointer;padding:0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.pk.on,.sw.on{border-color:#fff}
.pk:focus-visible,.sw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.field select{flex:1;min-width:0;background:#1b1a18;border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:10px;font:inherit}
.ttl{display:inline-block;background:#7c2929;color:#fff;font-size:.72em;font-weight:800;line-height:1;padding:3px 4px 2px;border-radius:3px;margin-right:5px;vertical-align:.08em;letter-spacing:.02em}
.me .who-btn{background:none;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;padding:0;color:var(--fg)}
.who-btn b{font-size:.95rem}
.who-btn span{color:var(--muted);font-size:.78rem}
button.b.sm{padding:7px 10px;font-size:.85rem;border-bottom-width:3px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700}
.form input{background:#1b1a18;border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:11px;font:inherit;font-weight:400}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #33312e;white-space:nowrap}
.tbl small{color:var(--muted)}
.pos{color:#9bd35f!important}
.neg{color:#e3776b!important}
.me-row td{background:#2f3a26}
.card:has(.tbl){overflow-x:auto}
.who{display:flex;align-items:center;gap:14px}
.who .av{position:relative;width:56px;height:56px;border-radius:6px;background:#565350;flex:none}
.who h1{font-size:1.5rem;margin:0}
.who .rate{margin-left:auto;text-align:right}
.rate b{display:block;font-size:1.9rem;font-weight:800;line-height:1}
.rate span{color:var(--muted);font-size:.78rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--panel2);border-radius:7px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:1.25rem}
.stats span{color:var(--muted);font-size:.72rem}
@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{position:static;height:auto;flex:none;flex-direction:row;align-items:center;padding:8px 10px;gap:4px}
  .brand{padding:0 6px 0 0;font-size:1.15rem}
  .brand i{width:28px;height:28px}
  .nav{flex-direction:row;width:100%;order:3;justify-content:space-between}
  .nav button{padding:8px 10px;font-size:.9rem}
  .nav svg{display:none}
  .sidebar{flex-wrap:wrap}
  .me{display:flex;flex-direction:row;margin:0 0 0 auto;padding:0;align-items:center;gap:6px}
  .me .who-btn span{display:none}
  main{padding:14px 16px 32px}
  .stage{flex-direction:column;align-items:center;gap:14px}
  .boardcol{width:min(100%,19rem)}
  .sidecol{max-width:none;width:100%;flex:none}
  .stage:not(.play) .sidecol{order:-1}
  .stage.play .sidecol{display:contents}
  .stage.play .sidecol>*{width:100%}
  .stage.play .sidecol>.card:first-child{order:-1}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

</style>
</head>

      <button id="nav-profile" data-act="nav" data-v="profile"><span id="ic-profile"></span>Profile</button>
    </div>
    <div class="me" id="acct"></div>
  </nav>
  <main id="main"></main>
</div>

/* Chungi rules engine */

var COLS=4, ROWS=8;
var DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
var KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function other(s){return s==='w'?'b':'w';}
function home(s){return s==='w'?0:7;}
function far(s){return s==='w'?7:0;}
function eq(a,b){return !!a&&!!b&&a[0]===b[0]&&a[1]===b[1];}
function inB(c,r){return c>=0&&c<COLS&&r>=0&&r<ROWS;}
function sqn(p){return 'ABCD'[p[0]]+(p[1]+1);}
function dist(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);}
function sideName(s){return s==='w'?'White':'Black';}

function newState(place, mag){
  return {n:0, turn:'w', step:'main', M:mag,
    w:{S:[place.w.s,0],H:[place.w.h,0],C:null,sFar:false,hFar:false},
    b:{S:[place.b.s,7],H:[place.b.h,7],C:null,sFar:false,hFar:false},
    first:true, lastMag:null, tm:null, sup:null, supNext:null, mm:{w:false,b:false}, tmm:false, winner:null, draw:false, reps:{}, log:[]};
}
function occ(st,c,r){
  var q=[c,r];
  if(eq(st.M,q)) return true;
  for(var i=0;i<2;i++){var p=st[i?'b':'w']; if(eq(p.S,q)||eq(p.H,q)||eq(p.C,q)) return true;}
  return false;

function stopWait(){ clearInterval(waitTimer); waitTimer=null; S.wait=null; }
function netFail(msg){ stopWait(); S.msg=msg; S.view='home'; S.panel='menu'; render(); }
function needLogin(){
  if(!sb){ S.msg='Online play is not set up in this copy of the page.'; render(); return true; }
  if(!Me){ S.view='auth'; S.authMode='login'; S.authMsg='Log in or sign up to play online.'; render(); return true; }
  return false;
}
function enterGame(remoteId){
  stopWait();
  sb.from('games').select('*').eq('id',remoteId).single().then(function(r){
    if(r.error||!r.data||!Me){ netFail('The game could not be loaded.'); return; }
    var row=r.data, me=row.white===Me.id?'w':'b', ctl={w:'net',b:'net'}; ctl[me]='me';
    var start=function(t){ newGame({mode:'net',ctl:ctl,inc:row.inc,names:{w:row.white_name,b:row.black_name},ratings:{w:row.white_before,b:row.black_before},remote:row.id,prof:t}); Net.open(row.id,beat); };
    /* title, icon and flag are optional: if they cannot be read, the game starts without them */
    sb.from('profiles').select('*').in('id',[row.white,row.black]).then(function(p){
      var t={w:{},b:{}}; ((p&&p.data)||[]).forEach(function(x){ var o={title:x.title||null,avatar:x.avatar||null,country:x.country||null}; if(x.id===row.white)t.w=o; if(x.id===row.black)t.b=o; }); start(t);
    }).catch(function(){ start({w:{},b:{}}); });
  });
}
function findGame(){
  if(needLogin())return;
  var inc=S.inc, busy=false; S.wait={kind:'find',state:'Looking for an opponent'}; render();
  var tick=function(){
    if(busy||!S.wait||S.wait.kind!=='find')return; busy=true;
    rpc('find_match',{p_inc:inc}).then(function(g){ busy=false; if(g&&S.wait&&S.wait.kind==='find')enterGame(g); })
      .catch(function(e){ busy=false; netFail('Matchmaking failed: '+e.message); });
  };
  tick(); waitTimer=setInterval(tick,2000);
}
function createRoom(){
  if(needLogin())return;
  var inc=S.inc; S.wait={kind:'room',room:null}; render();
  rpc('create_room',{p_inc:inc}).then(function(c){
    if(!S.wait||S.wait.kind!=='room')return;
    S.wait.room=c; render();
    var busy=false;
    waitTimer=setInterval(function(){
      if(busy||!S.wait||S.wait.kind!=='room')return; busy=true;
      rpc('room_game',{p_code:c}).then(function(g){ busy=false; if(g&&S.wait&&S.wait.kind==='room')enterGame(g); }).catch(function(){ busy=false; });
    },2000);
  }).catch(function(e){ netFail('The room could not be created: '+e.message); });
}
function joinRoom(room){
  room=String(room||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); if(!room)return;
  if(!sb){ S.msg='Online play is not set up in this copy of the page.'; render(); return; }
  if(!Me){ S.pendingRoom=room; needLogin(); return; }
  S.wait={kind:'join',room:room}; S.view='home'; S.panel='friend'; render();
  rpc('join_room',{p_code:room}).then(function(g){ if(g)enterGame(g); else netFail('That room was not found.'); })
    .catch(function(e){
      var m=e.message||'';
      netFail(/not found/.test(m)?'That room was not found. Check the code or ask your friend for a new link.':/own room/.test(m)?'That is your own room. Send the link to a friend.':/full/.test(m)?'That room already has two players.':'The room could not be joined: '+m);
    });
}
function cancelWait(){
  var w=S.wait; stopWait();
  if(w&&sb&&Me){ if(w.kind==='find')rpc('leave_queue').catch(noop); if(w.kind==='room')rpc('close_room').catch(noop); }
  render();
}
/* Every 2.5 seconds each player repeats what they have done so far, so a lost message repairs itself. */
var beatN=0;
function beat(){
  var g=game; if(!g||g.mode!=='net')return;
  var me=myColor(), both=g.locked.w&&g.locked.b, tf=Math.max(0,g.hist.acts.length-6);
  Net.send({t:'ping',lock:g.locked[me],place:both?g.place[me]:null,mag:me==='b'?g.hist.mag:null,n:g.hist.acts.length,re:g.rematch.me,over:g.over||null,tf:tf,tail:g.hist.acts.slice(tf)});
  if(g.phase==='play'&&!g.over&&(++beatN%6===0))watchRecord(g);
}
/* If the server already holds a result for this game while it is still being played here, catch up or dispute it. */
function watchRecord(g){
  sb.from('games').select('status,result,reason,white_report,black_report').eq('id',g.remote).maybeSingle().then(function(r){
    if(!r||!r.data||game!==g||g.over)return;
    var row=r.data, me=myColor(), theirs=me==='w'?row.black_report:row.white_report;
    if(row.status==='done'){ finish(row.result==='d'?{draw:true,reason:row.reason||'recorded as a draw'}:{winner:row.result,reason:row.reason||'recorded result'}); return; }
    if(theirs===me){ finish({winner:me,reason:row.reason||'by resignation'}); return; }
    if(theirs){
      Net.send({t:'need',from:g.hist.acts.length});
      if(++g.suspect>=2) rpc('report_game',{p_game:g.remote,p_result:'x',p_reason:null,p_moves:null}).then(function(){ if(game===g&&!g.over){ g.rated='void'; finish({draw:true,reason:'the two players disagree about the result'}); } }).catch(noop);
    }
  });
}
function applyRemote(from,acts,c){
  var g=game, opp=other(myColor());
  if(g.phase!=='play'||g.over||!acts)return;
  for(var k=0;k<acts.length;k++){
    var idx=from+k;
    if(idx<g.hist.acts.length)continue;
    if(idx>g.hist.acts.length){ Net.send({t:'need',from:g.hist.acts.length}); return; }
    if(g.G.turn!==opp)return;
    doAct(acts[k],true);
    if(g.over)return;
  }
  if(typeof c==='number'){ g.clock[opp]=c; g.last=Date.now(); }
}
Net.on({
  beat:beat,
  msg:function(d){
    var g=game; if(!d||!d.t||!g||g.mode!=='net')return;
    var me=myColor(), opp=other(me);
    if(d.t==='ping'){
      var ch=false;
      if(d.lock&&!g.locked[opp]){ g.locked[opp]=true; ch=true; }
      if(d.place&&!g.place[opp]){ g.place[opp]=d.place; g.locked[opp]=true; ch=true; }
      if(ch){ checkSetup(); beat(); }
      if(d.mag&&g.phase==='magician'&&opp==='b'){ g.hist.mag=d.mag; startPlay(d.mag); ch=false; }
      if(d.tail&&d.tail.length&&g.phase==='play'&&!g.over) applyRemote(d.tf,d.tail,null);
      if(game!==g)return;
      if(typeof d.n==='number'&&g.phase==='play'&&!g.over&&d.n>g.hist.acts.length) Net.send({t:'need',from:g.hist.acts.length});
      if(d.over&&!g.over&&(d.over.draw||d.over.winner)){ finish(d.over.draw?{draw:true,reason:String(d.over.reason||'')}:{winner:d.over.winner==='w'?'w':'b',reason:String(d.over.reason||'')}); return; }
      if(d.re&&!g.rematch.opp&&g.over){ g.rematch.opp=true; tryRematch(); ch=true; }
      if(ch&&game===g)render();
    }
    else if(d.t==='need'){ Net.send({t:'sync',from:d.from,acts:g.hist.acts.slice(d.from)}); }
    else if(d.t==='sync'){ applyRemote(d.from,d.acts,null); }
    else if(d.t==='act'){ applyRemote(d.i,[d.a],d.c); }
    else if(d.t==='flag'){ finish({winner:me,reason:'on time'}); }
    else if(d.t==='resign'){ finish({winner:me,reason:'by resignation'}); }
    else if(d.t==='room'){ if(g.over&&g.rematch.me&&!g.rejoin){ g.rejoin=true; rpc('join_room',{p_code:d.code}).then(function(id){ if(id&&game===g)enterGame(id); }).catch(function(){ g.rejoin=false; }); } }
  },
  close:function(){
    var g=game; if(!g||g.mode!=='net')return;
    if(!g.over)finish({winner:myColor(),reason:'the opponent left the game'});
    else { g.note='The opponent has left.'; render(); }
  }
});
/* Rematch: when both players ask, White of the finished game opens a room and Black joins it. */
function tryRematch(){
  var g=game; if(!g||!g.over||!(g.rematch.me&&g.rematch.opp)||g.rematchRoom||myColor()!=='w')return;
  g.rematchRoom=true;
  rpc('create_room',{p_inc:g.inc}).then(function(c){
    var busy=false, n=0, iv=setInterval(function(){
      if(game!==g||++n>30){ clearInterval(iv); return; }
      Net.send({t:'room',code:c});
      if(busy)return; busy=true;
      rpc('room_game',{p_code:c}).then(function(id){ busy=false; if(id&&game===g){ clearInterval(iv); enterGame(id); } }).catch(function(){ busy=false; });
    },1500);
  }).catch(function(){ g.rematchRoom=false; });
}
/* Report the result. Ratings change when both players report the same result. */
function report(g){
  if(!sb||!Me||g.mode!=='net'||g.reported)return;
  g.reported=true;
  if(g.rated==='void')return;
  if(!g.G||!g.hist.acts.length){ g.rated='none'; return; }
  g.rated='pending';
  var res=g.over.draw?'d':g.over.winner, tries=0;
  var settle=function(st){
    sb.from('games').select('*').eq('id',g.remote).maybeSingle().then(function(r){ if(r&&r.data)g.row=r.data; return Me?loadProfile(Me.id):null; }).then(function(){ g.rated=st; render(); }).catch(function(){ g.rated=st; render(); });
  };
  var call=function(){
    rpc('report_game',{p_game:g.remote,p_result:res,p_reason:g.over.reason,p_moves:{place:g.place,mag:g.hist.mag,acts:g.hist.acts}})
      .then(function(st){ if(st==='live'){ if(++tries<40)setTimeout(call,tries<4?2000:5000); else settle('late'); } else settle(st); })
      .catch(function(){ if(++tries<40)setTimeout(call,5000); else settle('late'); });
  };
  call();
}
function ratedText(g){
  if(g.rated==='none')return 'Not rated: the game ended before the first move.';
  if(g.rated==='void')return 'Not rated: the two players reported different results.';
  if(g.rated==='late')return 'The result is saved once the other player confirms it.';
  if(g.rated==='done'&&g.row&&g.row.white_after!==null){ var w=myColor()==='w', b=w?g.row.white_before:g.row.black_before, a=w?g.row.white_after:g.row.black_after, d=a-b; return 'Your rating: '+b+' to <b style="color:#fff">'+a+'</b> ('+(d>=0?'+':'')+d+')'; }
  return 'Saving the result';
}
function leaveGame(){
  var g=game;
  if(g&&g.mode==='net'){ if(!g.over&&g.phase==='play'){ Net.send({t:'resign'}); finish({winner:other(myColor()),reason:'by resignation'}); } Net.close(); }
  game=null; gid++; S.view='home'; S.panel='menu'; stopWait(); render();
}

function afterLogin(user){
  return loadProfile(user.id).then(function(){
    S.authBusy=false; S.authMsg='';
    if(S.view==='auth')S.view='home';
    var r=S.pendingRoom; S.pendingRoom=null;
    render(); if(r&&Me)joinRoom(r);
  });
}
function doAuth(f){
  if(!sb||S.authBusy)return;
  var email=(f.email.value||'').trim(), pw=f.password.value||'', name=f.username?(f.username.value||'').trim():'';
  var fail=function(m){ S.authBusy=false; S.authMsg=m; S.authForm={email:email,username:name}; render(); };
  S.authForm={email:email,username:name};
  if(!/^\S+@\S+\.\S+$/.test(email))return fail('Enter a valid email address.');
  if(pw.length<6)return fail('The password must have at least 6 characters.');
  S.authBusy=true; S.authMsg=''; render();
  if(S.authMode==='signup'){
    if(!/^[A-Za-z0-9_]{3,16}$/.test(name))return fail('The username must be 3 to 16 letters, digits or underscores.');
    rpc('username_available',{p_name:name}).then(function(ok){
      if(!ok){ fail('That username is taken. Choose another one.'); return; }
      return sb.auth.signUp({email:email,password:pw,options:{data:{username:name}}}).then(function(r){
        if(r.error){ fail(r.error.message); return; }
        if(r.data&&r.data.session&&r.data.user)return afterLogin(r.data.user);
        S.authMode='login'; fail('Your account was created. Open the confirmation link in your email, then log in.');
      });
    }).catch(function(e){ fail('Sign up failed: '+e.message); });
  } else {
    sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
      if(r.error){ fail(/invalid/i.test(r.error.message)?'Wrong email or password.':r.error.message); return; }
      return afterLogin(r.data.user);
    }).catch(function(e){ fail('Log in failed: '+e.message); });
  }
}
function logout(){
  if(game&&game.mode==='net'){ if(!confirmLeave())return; leaveGame(); }
  stopWait(); var p=sb?sb.auth.signOut():null; if(p&&p.catch)p.catch(noop);
  Me=null; S.view='home'; S.panel='menu'; render();
}

/* ================= board ================= */
function pieces(){
  var P={}, g=game, G=g.G, k=function(p){return p[0]+','+p[1];}, fl=flipped();
  function dirOf(s){ var up=fwd(G,s)>0; if(fl)up=!up; return up?'up':'down'; }

function targets(){

  if(g.phase==='magician'){ [[1,3],[2,3],[1,4],[2,4]].forEach(function(q){T[k(q)]='place';}); return T; }
  var G=g.G, s=G.turn;
  if(supMode){ superTargets(G).forEach(function(m){T[k(m.to)]='place';}); return T; }

function onCell(c,r){
  var g=game; if(!g||g.over||!myTurn())return;

    var pr=placer(); if(r!==home(pr))return;
    if(g.pick.s===c){g.pick.s=g.pick.h; g.pick.h=null;} else if(g.pick.h===c)g.pick.h=null;
    else if(g.pick.s===null)g.pick.s=c; else if(g.pick.h===null)g.pick.h=c;
    render(); return;
  }
  if(g.phase==='magician'){ if(T[key]){ startPlay(q); if(g.mode==='net')beat(); } return; }
  var G=g.G, s=G.turn;
  if(supMode){ if(T[key])doAct({t:'super',to:q}); else {supMode=false;render();} return; }
  if(G.step==='steed'){ if(T[key])doAct({t:'H',to:q}); return; }

  if(T[key]){

    else if(sel==='C')doAct({t:'C',to:q});

}

  mv=$('moves'); if(mv)mv.scrollTop=mv.scrollHeight;
  paintClocks();
  ['home','learn','watch','leaders','profile'].forEach(function(v){var e=$('nav-'+v); if(e)e.className=(v==='home'&&(S.view==='home'||(S.view==='game'&&game&&game.mode!=='watch')))||(v==='learn'&&S.view==='learn')||(v==='watch'&&S.view==='game'&&game&&game.mode==='watch')||(v==='leaders'&&S.view==='leaders')||(v==='profile'&&(S.view==='profile'||S.view==='auth'))?'on':'';});
  if(keepFocus&&$(keepFocus)&&keepFocus==='cinc')$(keepFocus).focus();
}
function confirmLeave(){ return !game||game.over||game.mode==='watch'||game.phase==='setup'&&game.mode!=='net'||window.confirm('Leave the current game?'); }
document.addEventListener('click',function(e){
  var cell=e.target.closest('.cell'); if(cell&&cell.closest('#board')){onCell(+cell.dataset.c,+cell.dataset.r);return;}
  var b=e.target.closest('[data-act]'); if(!b)return; var a=b.dataset.act, v=b.dataset.v;
  if(a==='nav'){
    if(S.view==='game'&&game&&v!=='game'){ if(v==='home'&&!game.over&&game.mode!=='watch'){render();return;} if(!confirmLeave())return; leaveGame(); }
    if(v==='watch'){startWatch();return;}
    if(v==='profile'){ if(!Me){S.view='auth';S.authMsg='';render();return;} openProfile(); return; }
    if(v==='leaders'){openLeaders();return;}
    S.view=v; if(v==='home'){S.panel='menu';} render();
  }
  else if(a==='panel'){S.panel=v; S.msg=''; render();}
  else if(a==='inc'){ if(v==='c'){S.custom=true; if(S.inc===null)S.inc=3;} else {S.custom=false; S.inc=v==='n'?null:+v;} render(); }
  else if(a==='level'){S.level=+v;render();}
  else if(a==='color'){S.color=v;render();}
  else if(a==='startbot'){ startBot(); }
  else if(a==='startlocal'){ startLocal(); }
  else if(a==='find'){ if(S.inc===null)S.inc=3; findGame(); }
  else if(a==='create'){ if(S.inc===null)S.inc=3; createRoom(); }
  else if(a==='join'){ joinRoom($('jcode').value); }
  else if(a==='cancel'){ cancelWait(); }
  else if(a==='auth'){ S.view='auth'; S.authMode=v; S.authMsg=''; S.authForm=null; render(); }
  else if(a==='authmode'){ S.authMode=v; S.authMsg=''; render(); }
  else if(a==='logout'){ logout(); }
  else if(a==='avpiece'){ if(S.edit){S.edit.piece=v; S.edit.msg=''; render();} }
  else if(a==='avcolor'){ if(S.edit){S.edit.color=+v; S.edit.msg=''; render();} }
  else if(a==='saveprofile'){ saveProfile(); }
  else if(a==='copy'){ var l=$('link'); l.select(); try{navigator.clipboard.writeText(l.value);}catch(err){try{document.execCommand('copy');}catch(e2){}} b.textContent='Copied'; }
  else if(a==='lock'){ var pr=placer(); if(pr&&game.pick.s!==null&&game.pick.h!==null){ game.place[pr]={s:game.pick.s,h:game.pick.h}; game.locked[pr]=true; game.pick={s:null,h:null}; checkSetup(); if(game.mode==='net')beat(); render(); } }
  else if(a==='super'){resetSel();supMode=true;render();}
  else if(a==='nosuper'){supMode=false;render();}
  else if(a==='fuse'){ if(myTurn())doAct({t:'fuse'}); }
  else if(a==='end'){ if(myTurn())doAct({t:'end'}); }
  else if(a==='pushS'||a==='pushH'){ if(myTurn()&&game.G.step==='push')doAct({t:'push',who:a.slice(4)}); }
  else if(a==='pushdone'){ if(myTurn()&&game.G.step==='push')doAct({t:'pushdone'}); }
  else if(a==='resign'){ if(game&&!game.over&&window.confirm('Resign this game?')){ var mc=myColor(); if(game.mode==='net')Net.send({t:'resign'}); finish({winner:other(mc),reason:'by resignation'}); } }
  else if(a==='leave'){ if(confirmLeave())leaveGame(); }
  else if(a==='again'){ var g=game; if(g.mode==='bot')startBot(); else if(g.mode==='watch')startWatch(); else startLocal(); }
  else if(a==='rematch'){ game.rematch.me=true; beat(); tryRematch(); if(game)render(); }
});
document.addEventListener('input',function(e){
  if(e.target.id==='cinc'){var n=Math.max(0,Math.min(60,Math.round(+e.target.value||0))); S.inc=n;}
  if(e.target.id==='jcode')S.joinCode=e.target.value;
});
document.addEventListener('change',function(e){ if(e.target.id==='country'&&S.edit){ S.edit.country=e.target.value; S.edit.msg=''; render(); } });
document.addEventListener('submit',function(e){ if(e.target.id==='authform'){ e.preventDefault(); doAuth(e.target); } });
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.id==='jcode')joinRoom(e.target.value); });
window.addEventListener('beforeunload',function(e){ if(game&&!game.over&&game.mode==='net'&&game.phase==='play'){e.preventDefault(); e.returnValue='';} });
$('brandicon').innerHTML=pieceSVG('M','');
$('ic-play').innerHTML=ICON.play; $('ic-learn').innerHTML=ICON.learn; $('ic-watch').innerHTML=ICON.watch; $('ic-leaders').innerHTML=ICON.leaders; $('ic-profile').innerHTML=ICON.account;
render();
var room=new URLSearchParams(location.search).get('room');
if(room){ try{history.replaceState(null,'',location.pathname);}catch(e){} }
function boot(){ if(room){ var r=room; room=null; joinRoom(r); } }
if(sb){
  sb.auth.getSession().then(function(r){ var se=r&&r.data&&r.data.session; if(se&&se.user)return loadProfile(se.user.id); })
    .then(function(){ render(); boot(); }).catch(function(){ boot(); });
  sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT'&&Me){ Me=null; setTimeout(render,0); } });
} else boot();
window.__chungi={state:function(){return {view:S.view,panel:S.panel,wait:S.wait,game:game&&{mode:game.mode,phase:game.phase,over:game.over,turn:game.G&&game.G.turn,step:game.G&&game.G.step,me:myColor(),clock:game.clock,inc:game.inc,rated:game.rated,n:game.hist.acts.length,names:game.names,prof:game.prof},user:Me&&{username:Me.username,rating:Me.rating,games:Me.games,avatar:Me.avatar,country:Me.country},msg:S.msg,authMsg:S.authMsg};}};
})();

</script>
